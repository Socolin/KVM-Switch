name: Deploy Configurator

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:   # lets you deploy manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/configurator
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/configurator/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx ng build --base-href /KVM-Switch/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: tools/configurator/dist/configurator/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5